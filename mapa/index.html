<style>
:root{
  --forest-abyss:#0d1a14; --forest-deep:#12211b; --forest:#1f3a2e; --forest-soft:#2c4a3b;
  --gold:#c5a572; --gold-lt:#ddc79c; --cream:#f4f1e8; --paper:#fbf9f3;
  --ink:#171a17; --muted:#8b948a; --line:rgba(197,165,114,.18);
  --panel:#14231b; --panel-2:#1a2c22; --panel-3:#22392c;
  --fs-display:'Prata',Georgia,'Times New Roman',serif;
  --fs-body:'Newsreader',Georgia,serif;
  --fs-ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --side:344px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-height:100%}
body{background:var(--forest-abyss);color:var(--cream);font-family:var(--fs-ui);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--forest-abyss)}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--forest-soft)}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column}
.topbar{position:sticky;top:0;display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--forest-deep);border-bottom:1px solid var(--line);z-index:1200}
.brand{display:flex;align-items:center;flex-shrink:0;text-decoration:none}
.brand img{height:30px;width:auto;display:block}
.footlogo{height:34px;width:auto;display:block;margin-bottom:14px;opacity:.9}
.tsep{width:1px;height:26px;background:var(--line);flex-shrink:0}
.searchwrap{position:relative;flex:1;max-width:420px}
.searchwrap input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:8px 32px 8px 11px;font-size:.82rem;color:var(--cream)}
.searchwrap input::placeholder{color:var(--muted)}
.searchwrap input:focus{border-color:var(--gold);outline:none}
.searchwrap .sicon{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem;pointer-events:none}
.sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);max-height:340px;overflow-y:auto;z-index:1500;box-shadow:0 14px 40px -12px rgba(0,0,0,.7)}
.sugg:empty{display:none}
.sugg button{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid rgba(197,165,114,.08);font-size:.8rem}
.sugg button:hover,.sugg button.on{background:var(--panel-3)}
.sugg .sn{color:var(--cream)}
.sugg .sm{color:var(--muted);font-size:.72rem;margin-top:2px}
.spacer{flex:1}
.seg{display:flex;border:1px solid rgba(197,165,114,.34);border-radius:2px;overflow:hidden;flex-shrink:0}
.seg button{font-size:.68rem;font-weight:600;letter-spacing:.1em;color:rgba(255,255,255,.6);padding:6px 11px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--forest-deep)}
a.tbtn{text-decoration:none;display:inline-block}
.tbtn{font-size:.72rem;font-weight:500;padding:7px 12px;border:1px solid var(--line);border-radius:2px;color:#cfd6cb;white-space:nowrap;flex-shrink:0}
.tbtn:hover{border-color:var(--gold);color:#fff}
.tbtn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--forest-deep);font-weight:700}

.mapsection{display:grid;grid-template-columns:var(--side) 1fr;height:min(82vh,860px);min-height:520px}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:1100}
.side-scroll{overflow-y:auto;flex:1;min-height:0}
#map{width:100%;height:100%;background:#0b1712}

.sblock{border-bottom:1px solid var(--line);padding:14px 16px}
.sblock h4{font-size:.6rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:11px;display:flex;align-items:center;justify-content:space-between}
.sblock h4 .cnt{color:var(--muted);font-weight:600;letter-spacing:.04em}
.catrow{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;user-select:none}
.catrow:hover .cl{color:#fff}
.swatch{width:13px;height:13px;border-radius:3px;flex-shrink:0;border:1px solid rgba(255,255,255,.22);transition:.15s}
.catrow.off .swatch{background:transparent!important}

/* ---------- basemap switcher ---------- */
.basebar{position:absolute;right:12px;bottom:12px;z-index:900;display:flex;flex-direction:column;gap:3px}

/* ---------- franja: ver propiedades ---------- */
.propband{background:linear-gradient(90deg,var(--gold) 0%,var(--gold-lt) 100%);color:var(--forest-deep)}

.propband .pb-e{font-size:.62rem;font-weight:700;letter-spacing:.26em;text-transform:uppercase;opacity:.72}

.pbtn{display:inline-flex;align-items:center;gap:10px;background:var(--forest-deep);color:var(--gold-lt);
 padding:14px 26px;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-decoration:none;border-radius:2px;
 border:1px solid var(--forest-deep);white-space:nowrap;transition:.16s}
.pbtn:hover{background:var(--forest-abyss);color:#fff}
.pbtn .ar{font-size:1.05rem;line-height:1}

/* ---------- markers ---------- */
.mk{display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid rgba(9,20,15,.9);box-shadow:0 2px 8px rgba(0,0,0,.5);font-size:9px;color:rgba(9,20,15,.85);font-weight:700;transition:transform .14s}

.mklbl{position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:2px;white-space:nowrap;font-size:10px;font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 0 6px #000,0 1px 2px #000;pointer-events:none}

/* ---------- popup ---------- */
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--cream);border-radius:3px;border:1px solid var(--line);box-shadow:0 18px 50px -14px rgba(0,0,0,.8)}

.pop-k{font-size:.58rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:5px}

.near{border-top:1px solid var(--line);padding-top:10px}

.measure-line{stroke:var(--gold);stroke-width:2.5;stroke-dasharray:7 5}

.leaflet-tooltip.ztip{background:rgba(13,26,20,.9);border:1px solid rgba(197,165,114,.3);color:var(--gold-lt);font-family:var(--fs-ui);font-size:10px;font-weight:600;line-height:1.35;padding:3px 7px;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap}

/* ---------- modal ---------- */

.modal-b{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:13px}
.frow{display:flex;flex-direction:column;gap:5px}

.minibtn:hover{border-color:var(--gold);color:#fff}
.minibtn.on{background:var(--gold);color:var(--forest-abyss);border-color:var(--gold);font-weight:700}
.modal-f{display:flex;align-items:center;gap:8px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.mbtn{font-size:.75rem;font-weight:600;padding:9px 18px;border:1px solid var(--line);border-radius:2px;color:#cfd6cb}

/* ---------- verifier ---------- */
.vbar{margin-bottom:10px}

.prop-n{font-size:.78rem;color:var(--cream);font-weight:600}
.prop-d{font-size:.68rem;color:var(--gold-lt);font-variant-numeric:tabular-nums;white-space:nowrap}
.prop-l{font-size:.67rem;color:var(--muted);margin-top:3px;line-height:1.4}
.prop-a{display:flex;gap:5px;margin-top:8px}
.prop-a .minibtn{flex:1;padding:4px 0;font-size:.66rem;text-align:center}
.minibtn.ok{border-color:rgba(140,192,142,.4);color:#8cc08e}
.minibtn.ok:hover{background:#3d6b3f;color:#fff;border-color:#3d6b3f}
.pop-addr{font-size:.7rem;color:var(--gold-lt);font-family:var(--fs-ui);margin-top:4px}
.padron{display:flex;gap:8px;align-items:baseline;font-size:.68rem;margin-bottom:2px}
.padron span{color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-size:.58rem;font-weight:700}
.padron b{color:#cfd6cb;font-variant-numeric:tabular-nums}
.intnote{background:rgba(196,114,106,.12);border-left:2px solid #c4726a;padding:9px 11px;font-size:.7rem;line-height:1.5;color:#e0b5b0}
.rev .ra{font-size:.62rem;color:var(--muted);display:block;margin-top:1px}

/* ---------- review list ---------- */
.revlist{display:flex;flex-direction:column;gap:1px;max-height:186px;overflow-y:auto}

/* ---------- listing + sale popup extras ---------- */
.pop-photo{width:100%;height:142px;object-fit:cover;display:block;background:var(--panel-2)}

.badge.venta{background:rgba(92,138,94,.2);color:#8cc08e}
.badge.reservada{background:rgba(197,165,114,.2);color:var(--gold-lt)}
.badge.vendida{background:rgba(196,114,106,.2);color:#d98d84}
.bigprice{font-family:var(--fs-display);font-size:1.5rem;color:var(--gold-lt);line-height:1.1;font-variant-numeric:tabular-nums}

.navlinks{display:flex;gap:2px;flex-shrink:0}

.navlinks a.navprops{color:var(--gold)}
.navlinks a:hover{color:#fff;background:rgba(197,165,114,.12)}
.sheet{background:var(--paper);color:var(--ink)}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(18px,3.5vw,44px)}
.hero{background:var(--forest-abyss);color:var(--cream);padding:clamp(34px,5vw,58px) 0 30px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:.64rem;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}

.hero h1 em{font-style:italic;font-family:var(--fs-body);font-weight:300;color:var(--gold-lt)}
.hero .lede{font-family:var(--fs-body);font-size:clamp(1rem,1.4vw,1.14rem);color:#b7c0b5;max-width:64ch;margin-top:14px;font-weight:300;line-height:1.6}
.hero .stamp{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:1px;background:var(--line);margin-top:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--forest-abyss);padding:16px 14px 14px}
.kpi .v{font-family:var(--fs-display);font-size:1.6rem;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.58rem;font-weight:600;letter-spacing:.1em;color:var(--muted);margin-left:4px;vertical-align:.55em;font-family:var(--fs-ui)}
.kpi .l{font-size:.68rem;line-height:1.35;color:var(--muted);margin-top:8px}
.kpi .d{font-size:.66rem;font-weight:600;margin-top:5px;color:#8cc08e}
section.blk{padding:clamp(38px,5vw,64px) 0;border-bottom:1px solid rgba(31,58,46,.12)}
.blk-h{max-width:68ch;margin-bottom:26px}

.blk-h p{font-family:var(--fs-body);color:#3b423b;font-weight:300;line-height:1.6}
.tablewrap{overflow-x:auto;border:1px solid rgba(31,58,46,.14)}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;font-size:.6rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#6e7469;padding:11px 13px;border-bottom:1px solid rgba(31,58,46,.14);white-space:nowrap;background:#f4f1e8;position:sticky;top:0}
td{padding:10px 13px;border-bottom:1px solid rgba(31,58,46,.09);color:#3b423b;vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f4f1e8}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
td.strong{color:var(--ink);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:rgba(31,58,46,.14);border:1px solid rgba(31,58,46,.14)}
.card{background:var(--paper);padding:24px 22px}
.card .ck{font-size:.58rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#8a6d2f}
.card h3{font-family:var(--fs-display);font-size:1.15rem;font-weight:400;margin:9px 0 8px;color:var(--forest)}
.card p{font-family:var(--fs-body);font-size:.88rem;color:#3b423b;font-weight:300;line-height:1.6}
.disc{background:#f4f1e8;border-left:3px solid var(--gold);padding:16px 20px;font-size:.77rem;line-height:1.6;color:#3b423b;margin-top:24px}
.pagefoot{background:var(--forest-deep);color:rgba(255,255,255,.66);padding:44px 0 36px;font-size:.76rem;line-height:1.6}

.pagefoot .cols{display:grid;grid-template-columns:1.4fr 1fr;gap:40px}
.pagefoot a{color:var(--gold-lt);text-decoration:none;border-bottom:1px solid rgba(197,165,114,.28)}

.srcs{display:flex;flex-direction:column;gap:5px;font-size:.72rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

  .mapsection{grid-template-columns:1fr;height:auto}

}

const ZONES = {"zones": [{"id": "peninsula", "lon": -54.947, "lat": -34.963, "n": "Península", "apt": [3200, 5500], "lot": [600, 1400], "ha": null, "mom": 2, "sub_es": "Punta del Este · núcleo histórico", "sub_en": "Punta del Este · historic core", "d_es": "El casco fundacional. Stock mayoritariamente de los 70–90, con reciclajes puntuales y muy poca tierra libre. Precio sostenido por ubicación y vista, no por producto nuevo: acá se compra scarcity, no upside de obra.", "d_en": "The founding core. Stock is mostly 1970s–90s with selective renovations and almost no vacant land. Prices hold on location and view rather than new product: you buy scarcity here, not construction upside."}, {"id": "brava", "lon": -54.926, "lat": -34.944, "n": "Playa Brava", "apt": [3500, 11000], "lot": [800, 2000], "ha": null, "mom": 5, "sub_es": "Parada 1–10 · el eje del ultralujo", "sub_en": "Parada 1–10 · the ultra-luxury axis", "d_es": "Donde se concentra el producto más caro del país. The Rock cotiza cerca de USD 11.000/m² y el penthouse superó los USD 15 M. El resto de la parada corre entre 3.500 y 6.500. Es el benchmark contra el que se mide todo lo demás.", "d_en": "Where the country's priciest product concentrates. The Rock trades near USD 11,000/m², with a penthouse above USD 15 M. The rest of the stretch runs 3,500–6,500. It is the benchmark everything else is measured against."}, {"id": "mansa", "lon": -54.98016, "lat": -34.92116, "n": "Playa Mansa", "apt": [2000, 5000], "lot": [185, 700], "ha": null, "mom": 5, "sub_es": "20+ proyectos activos · el frente que más crece", "sub_en": "20+ active projects · the fastest-growing front", "d_es": "Frente al mar 3.000–5.000/m²; hacia adentro sin vista, 2.000–2.500. Es la zona con más obra nueva de Punta: Fendi Château desde USD 1,3 M, Aquarela, La Aguada. Veramansa colocó lotes de laguna a USD 185/m², el dato duro más útil de tierra urbanizada en la Mansa.", "d_en": "Oceanfront 3,000–5,000/m²; inland without views, 2,000–2,500. The heaviest new-build zone in Punta: Fendi Château from USD 1.3 M, Aquarela, La Aguada. Veramansa placed lagoon lots at USD 185/m² — the hardest urbanized-land datapoint on the Mansa."}, {"id": "roosevelt", "lon": -54.968, "lat": -34.932, "n": "Roosevelt", "apt": [2000, 3000], "lot": [300, 700], "ha": null, "mom": 4, "sub_es": "Corredor de vivienda promovida", "sub_en": "Tax-promoted housing corridor", "d_es": "El motor del volumen, no del ticket. Monoambientes desde USD 117–148 K, renta exenta durante 10 años bajo vivienda promovida y yields reportados de hasta 7,7%. Es la zona donde el inversor chico entra y donde se hizo la mayoría de las 2.830 unidades promovidas.", "d_en": "The volume engine, not the ticket engine. Studios from USD 117–148 K, rental income tax-exempt for 10 years under the promoted-housing law, with reported yields up to 7.7%. This is where smaller investors enter and where most of the 2,830 promoted units were built."}, {"id": "pinares", "lon": -54.93969, "lat": -34.92909, "n": "Pinares · Cantegril", "apt": [2000, 3100], "lot": [350, 900], "ha": null, "mom": 3, "sub_es": "Barrio de casas · el m² más barato de Punta", "sub_en": "House neighbourhood · Punta's cheapest m²", "d_es": "Cotiza por debajo de Pocitos y Punta Carretas en Montevideo, algo que sorprende a los compradores extranjeros. Producto de casa y edificio bajo, lindero al Cantegril Country Club y al nuevo barrio privado Aura.", "d_en": "Trades below Pocitos and Punta Carretas in Montevideo — a fact that surprises foreign buyers. Houses and low-rise, bordering Cantegril Country Club and the new Aura gated community."}, {"id": "sanrafael", "lon": -54.918, "lat": -34.936, "n": "San Rafael", "apt": [2500, 11500], "lot": [500, 1200], "ha": null, "mom": 5, "sub_es": "Cipriani · USD 600 M en un solo predio", "sub_en": "Cipriani · USD 600 M on a single site", "d_es": "El ex Hotel San Rafael es hoy la mayor obra individual de la historia de Punta: torre de 320 m —la más alta de Sudamérica—, hotel, casino y centro de eventos. USD 11.500/m², unidades de 2 a 18 M, primera torre 50% vendida. Hotel y casino en octubre 2026, torre en 2027.", "d_en": "The former Hotel San Rafael is now Punta's largest single development ever: a 320 m tower — the tallest in South America — plus hotel, casino and events centre. USD 11,500/m², units from 2 to 18 M, first tower 50% sold. Hotel and casino October 2026, tower 2027."}, {"id": "rincon", "lon": -54.88831, "lat": -34.92298, "n": "Rincón del Indio", "apt": [3400, 5200], "lot": [400, 900], "ha": null, "mom": 4, "sub_es": "Puente entre la Brava y La Barra", "sub_en": "Bridge between La Brava and La Barra", "d_es": "Zona de torres frente al mar con menos densidad que la Brava y precio 25–35% menor. Se beneficia directamente del efecto Cipriani sobre San Rafael, su vecino inmediato.", "d_en": "Oceanfront towers with lower density than La Brava and prices 25–35% below it. Directly benefits from the Cipriani effect on neighbouring San Rafael."}, {"id": "labarra", "lon": -54.865723, "lat": -34.910214, "n": "La Barra", "apt": [3800, 6500], "lot": [38, 450], "ha": [25000, 120000], "mom": 5, "sub_es": "El nodo de barrios privados de la región", "sub_en": "The region's gated-community hub", "d_es": "Concentra la mayor oferta de barrios privados: Fasano Las Piedras (490 ha), Pueblo Mío (160 ha, 180 chacras), El Nido (66,2 ha con pileta de olas), La Carolina del Mar (60 ha), Astra, Puerto Quetzal, Reserva de Montoya. La dispersión de tierra es enorme: USD 17/m² en lotes grandes de El Quijote contra 450/m² en Fasano.", "d_en": "Holds the densest supply of gated communities: Fasano Las Piedras (490 ha), Pueblo Mío (160 ha, 180 chacras), El Nido (66.2 ha with a wave pool), La Carolina del Mar (60 ha), Astra, Puerto Quetzal, Reserva de Montoya. Land dispersion is extreme: USD 17/m² on large El Quijote lots versus 450/m² inside Fasano."}, {"id": "manantiales", "lon": -54.841, "lat": -34.899, "n": "Manantiales", "apt": [4000, 7400], "lot": [37, 2680], "ha": [30000, 150000], "mom": 5, "sub_es": "El m² de apartamento más caro después de José Ignacio", "sub_en": "Priciest apartment m² after José Ignacio", "d_es": "Signature at the Sea cotiza 5.500–7.400/m². En tierra, la brecha define la zona: primera fila llega a USD 2.680/m² (Punta Piedras) y USD 760/m², mientras que lotes de 4.000–5.000 m² en Pueblo Mío o Puerto Quetzal se consiguen entre 37 y 110/m². Ahí está el arbitraje.", "d_en": "Signature at the Sea trades at 5,500–7,400/m². On land, the spread defines the zone: front row reaches USD 2,680/m² (Punta Piedras) and USD 760/m², while 4,000–5,000 m² lots in Pueblo Mío or Puerto Quetzal go for 37–110/m². That gap is the arbitrage."}, {"id": "elchorro", "lon": -54.793, "lat": -34.881, "n": "El Chorro", "apt": [2500, 4500], "lot": [60, 400], "ha": [35000, 120000], "mom": 4, "sub_es": "Chacras marítimas de baja densidad", "sub_en": "Low-density seaside chacras", "d_es": "Tramo de casas grandes sobre lotes de 3.000–10.000 m², sin torres. Es el corredor natural de expansión de Manantiales hacia José Ignacio sobre Ruta 10.", "d_en": "A stretch of large houses on 3,000–10,000 m² lots, no towers. The natural expansion corridor from Manantiales toward José Ignacio along Route 10."}, {"id": "joseignacio", "lon": -54.642, "lat": -34.839, "n": "José Ignacio", "apt": [5000, 10000], "lot": [39, 554], "ha": [150000, 1200000], "mom": 5, "sub_es": "El techo del mercado · USD/ha récord del país", "sub_en": "Market ceiling · the country's record USD/ha", "d_es": "Techo absoluto en las tres métricas. Apartamentos 5.000–10.000/m². Lotes: 250–550/m² en Santa Mónica y La Juanita, 40–170/m² en el anillo exterior. Y la tierra: una chacra de 5 ha se pidió a USD 6 M (1,2 M/ha) y 39 ha sobre la laguna a USD 5,9 M (151 K/ha). Sin altura permitida y sin tierra costera libre.", "d_en": "Absolute ceiling on all three metrics. Apartments 5,000–10,000/m². Lots: 250–550/m² in Santa Mónica and La Juanita, 40–170/m² on the outer ring. And land: a 5 ha chacra asked USD 6 M (1.2 M/ha) and 39 ha on the lagoon USD 5.9 M (151 K/ha). No height allowance and no vacant coastal land."}, {"id": "lagunaji", "lon": -54.712, "lat": -34.818, "n": "Laguna José Ignacio", "apt": null, "lot": null, "ha": [80000, 400000], "mom": 5, "sub_es": "Chacras de laguna · 15–40 ha", "sub_en": "Lagoon chacras · 15–40 ha", "d_es": "El producto más buscado por el comprador internacional: parcelas grandes con frente de agua y acceso a la playa a minutos. 15 ha sobre laguna se pidieron a USD 5,4 M (360 K/ha); 39 ha a USD 5,9 M (151 K/ha). Oferta finita y sin reposición.", "d_en": "The most sought product for international buyers: large water-fronting parcels minutes from the beach. 15 ha on the lagoon asked USD 5.4 M (360 K/ha); 39 ha, USD 5.9 M (151 K/ha). Finite supply with no replacement."}, {"id": "ruta104", "lon": -54.824, "lat": -34.82, "n": "Ruta 104 · corredor interior", "apt": null, "lot": null, "ha": [26000, 90000], "mom": 5, "sub_es": "Atchugarry en el km 4,5 · Garzón School en el km 13,5", "sub_en": "Atchugarry at km 4.5 · Garzón School at km 13.5", "d_es": "La 104 sale de la Ruta 10 en Manantiales y sube al interior. En diez kilómetros concentra la Fundación Pablo Atchugarry y su parque de esculturas de 45 ha (km 4,5) y The Garzón School (km 13,5), campus K-12 de 38 ha abierto en 2025. Eso convierte a un camino rural en el corredor de residencia permanente más fuerte de la región. Comparables reales del eje interior: 9,9 ha a USD 258 K (26 K/ha), 5 ha a USD 450 K (90 K/ha), 19 ha sobre Camino Saiz Martínez a USD 520 K (27 K/ha). Es donde entraría capital paciente.", "d_en": "Route 104 leaves Route 10 at Manantiales and climbs inland. Within ten kilometres it holds the Pablo Atchugarry Foundation and its 45 ha sculpture park (km 4.5) and The Garzón School (km 13.5), a 38 ha K-12 campus opened in 2025. That turns a rural road into the region's strongest permanent-residence corridor. Real comps on the inland axis: 9.9 ha at USD 258 K (26 K/ha), 5 ha at USD 450 K (90 K/ha), 19 ha on Camino Saiz Martínez at USD 520 K (27 K/ha). This is where patient capital would go."}, {"id": "lagunagarzon", "lon": -54.588, "lat": -34.795, "n": "Laguna Garzón", "apt": null, "lot": [40, 250], "ha": [40000, 180000], "mom": 5, "sub_es": "El puente que abrió Rocha", "sub_en": "The bridge that opened Rocha", "d_es": "El puente circular de Rafael Viñoly conectó Maldonado con Rocha y convirtió la margen este en frontera de desarrollo. Todo lo que está entre José Ignacio y la laguna se revalorizó por proximidad; lo que está del otro lado todavía cotiza a precio de Rocha.", "d_en": "Rafael Viñoly's circular bridge linked Maldonado to Rocha and turned the eastern bank into a development frontier. Everything between José Ignacio and the lagoon repriced on proximity; the far side still trades at Rocha prices."}, {"id": "garzon", "lon": -54.578, "lat": -34.583, "n": "Pueblo Garzón", "apt": [1500, 2500], "lot": [30, 180], "ha": [8000, 40000], "mom": 5, "sub_es": "Bodega, arte y golf · el interior que se volvió destino", "sub_en": "Winery, art and golf · the interior that became a destination", "d_es": "Tres anclas duras: Bodega Garzón (Bulgheroni, USD 85 M+), el CAMPO Art Campus de 13 ha diseñado por Rafael Viñoly y el Tajamares Golf Club. Comparables reales: 20 chacras relevadas entre USD 8.000 y 40.000/ha, con el grueso entre 15.000 y 27.000. El mínimo legal de subdivisión rural es 5 ha, lo que pone un techo estructural a la densidad.", "d_en": "Three hard anchors: Bodega Garzón (Bulgheroni, USD 85 M+), the 13 ha CAMPO Art Campus by Rafael Viñoly, and Tajamares Golf Club. Real comps: 20 chacras surveyed between USD 8,000 and 40,000/ha, most clustering 15,000–27,000. The 5 ha legal minimum for rural subdivision structurally caps density."}, {"id": "ruta9garzon", "lon": -54.63, "lat": -34.7, "n": "Ruta 9 · eje Garzón", "apt": null, "lot": null, "ha": [8000, 27000], "mom": 4, "sub_es": "Campo productivo con opción de conversión", "sub_en": "Productive farmland with conversion optionality", "d_es": "Todavía cotiza como campo: 31 ha a USD 420 K (13,5 K/ha), 104 ha a USD 832 K (8 K/ha), 107 ha a USD 2,9 M (27 K/ha). El upside no está en la producción sino en la conversión a chacra lifestyle a medida que el corredor Garzón se consolida.", "d_en": "Still trades as farmland: 31 ha at USD 420 K (13.5 K/ha), 104 ha at USD 832 K (8 K/ha), 107 ha at USD 2.9 M (27 K/ha). The upside is not production but conversion to lifestyle chacras as the Garzón corridor consolidates."}, {"id": "puebloeden", "lon": -55.0578, "lat": -34.6312, "n": "Pueblo Edén", "apt": null, "lot": null, "ha": [12000, 25000], "mom": 4, "sub_es": "Sierras de Maldonado · Ruta 12", "sub_en": "Maldonado highlands · Route 12", "d_es": "El contrapunto serrano de Garzón: topografía real, arroyos y viñedos boutique. Comparable duro: 18 ha sobre Ruta 12 a USD 310 K (17 K/ha). Mercado chico, poca liquidez, pero el ticket de entrada a una chacra de sierra es una fracción del de la costa.", "d_en": "Garzón's highland counterpoint: real topography, streams and boutique vineyards. Hard comp: 18 ha on Route 12 at USD 310 K (17 K/ha). A small, thin market, but the entry ticket for a hill chacra is a fraction of the coast."}, {"id": "ruta39", "lon": -54.848, "lat": -34.5, "n": "Ruta 39 · San Carlos–Aiguá", "apt": null, "lot": null, "ha": [6000, 55000], "mom": 3, "sub_es": "La mayor dispersión de precio de la región", "sub_en": "The region's widest price dispersion", "d_es": "Mismo eje, precios que van de USD 6.300 a 55.000/ha según cercanía a la ruta, agua y aptitud. Es el corredor donde más se paga por hacer bien la due diligence: 53,8 ha se ofrecen a USD 850 K y otras 53,8 ha a USD 340 K.", "d_en": "Same axis, prices from USD 6,300 to 55,000/ha depending on road access, water and land quality. The corridor where due diligence pays most: 53.8 ha listed at USD 850 K and another 53.8 ha at USD 340 K."}, {"id": "aigua", "lon": -54.752, "lat": -34.206, "n": "Aiguá · Sierra Carapé", "apt": [600, 900], "lot": null, "ha": [8000, 15000], "mom": 2, "sub_es": "El punto más alto de Maldonado", "sub_en": "Maldonado's highest ground", "d_es": "Sierra Carapé, el punto más alto del departamento. 6,5 ha se ofrecen a USD 85 K (13 K/ha). Mercado de nicho, para el comprador que busca escala y aislamiento más que servicios.", "d_en": "Sierra Carapé, the department's highest point. 6.5 ha listed at USD 85 K (13 K/ha). A niche market for buyers seeking scale and isolation over services."}, {"id": "puntaballena", "lon": -55.052, "lat": -34.903, "n": "Punta Ballena", "apt": [3000, 4500], "lot": [150, 600], "ha": null, "mom": 4, "sub_es": "Bera Bay · USD 4–12 M por residencia", "sub_en": "Bera Bay · USD 4–12 M per residence", "d_es": "Casapueblo, la mejor puesta de sol de la costa y ahora Bera Bay, de Invergroup con Carlos Ott y Ponce de León, con residencias de USD 4 a 12 M. Grutas de la Ballena entrega en marzo 2026 con unidades desde USD 160 K: la brecha de producto más ancha de la región.", "d_en": "Casapueblo, the coast's best sunset, and now Bera Bay by Invergroup with Carlos Ott and Ponce de León, residences from USD 4 to 12 M. Grutas de la Ballena delivers March 2026 from USD 160 K — the widest product spread in the region."}, {"id": "portezuelo", "lon": -55.108, "lat": -34.884, "n": "Portezuelo · Solanas", "apt": [2000, 2800], "lot": [80, 300], "ha": [15000, 25000], "mom": 3, "sub_es": "Golf, bosque y aeropuerto a 10 minutos", "sub_en": "Golf, forest and airport 10 minutes away", "d_es": "Bosque consolidado, campo de golf y proximidad al Aeropuerto Internacional de Laguna del Sauce. Precio 35–45% por debajo de la Mansa con el mismo tiempo de acceso al centro.", "d_en": "Established forest, golf course, and proximity to Laguna del Sauce International Airport. Prices 35–45% below the Mansa with the same drive time to the centre."}, {"id": "lagunasauce", "lon": -55.128, "lat": -34.828, "n": "Laguna del Sauce", "apt": [ const $  = id => document.getElementById(id);
const setTxt  = (id, v) => { const e = $(id); if (e) e.textContent = v; };
const setHTML = (id, v) => { const e = $(id); if (e) e.innerHTML   = v; };
let L10N = "es";
const t = k => I[L10N][k] ?? k;
const nm = o => L10N === "es" ? o.es : o.en;

/* ============ state ============ */
const DATA_VERSION = "2026-08-25b";   // bump whenever coordinates ship corrected in the file
const OVR_KEY = "tango_poi_overrides_v1";
let overrides = {};
try {
  if (localStorage.getItem(OVR_KEY + "_ver") !== DATA_VERSION) {
    localStorage.removeItem(OVR_KEY);                 // corrections are baked in now
    localStorage.setItem(OVR_KEY + "_ver", DATA_VERSION);
  }
  overrides = JSON.parse(localStorage.getItem(OVR_KEY) || "{}");
} catch (e) { overrides = {}; }

const active = new Set(Object.keys(POIS.cats));

/* ============ map ============ */
const map = L.map("map", { zoomControl: false, minZoom: 6, maxZoom: 19, worldCopyJump: false })
  .setView([-34.80, -54.78], 11);
L.control.zoom({ position: "topright" }).addTo(map);

const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
/* Los basemaps de CARTO (voyager / light_all) pasaron a exigir API key: sin key
   devuelven el tile con la marca de agua "API key required". Se sacaron.
   Si algun dia se contrata un proveedor, se cambia la URL aca y nada mas. */
const BASES = {
  streets: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom:19, attribution: OSM_ATTR }),
  sat: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom:19, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics' })
};
const SAT_LABELS = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  { maxZoom:19, opacity:.9 });
let base = "streets";
BASES.streets.addTo(map);

function setBase(k){
  Object.values(BASES).forEach(l => map.removeLayer(l));
  map.removeLayer(SAT_LABELS);
  BASES[k].addTo(map);
  if (k === "sat" && showLabels) SAT_LABELS.addTo(map);
  base = k;
  document.querySelectorAll("[data-base]").forEach(b => b.setAttribute("aria-pressed", b.dataset.base === k));
  styleLabels();
}
function styleLabels(){
  const light = base === "min";
  document.querySelectorAll(".mklbl").forEach(e => {
    e.style.textShadow = light ? "0 0 3px #fff,0 0 7px #fff,0 1px 2px rgba(255,255,255,.9)" : "";
    e.style.color = light ? "#1b2b21" : "#fff";
  });
}

/* ============ geo helpers ============ */
function dist(a, b){
  const R = 6371, r = Math.PI/180;
  const dLa = (b[0]-a[0])*r, dLo = (b[1]-a[1])*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtKm = d => d < 1 ? Math.round(d*1000) + " m" : (d < 10 ? d.toFixed(1).replace(".", ",") : Math.round(d)) + " km";
const pos = p => overrides[p.id] || [p.lat, p.lon];
const fmtK = v => v >= 1e6 ? (v/1e6).toFixed(v >= 1e7 ? 0 : 1).replace(".", ",") + " M"
               : v >= 1000 ? Math.round(v/1000) + " K" : Math.round(v).toLocaleString("es-UY");

/* ============ zones (price layer) ============ */
const zoneById = {};
ZONES.zones.forEach(z => zoneById[z.id] = z);
const R_RAMP = ["#4a6b52","#6d8a57","#96a063","#bda169","#dcbb7a","#f0d9a2"];
function zTier(z){
  const v = z.ha ? Math.sqrt(z.ha[0]*z.ha[1]) : (z.apt ? Math.sqrt(z.apt[0]*z.apt[1])*30 : null);
  if (v === null) return 1;
  const lo = 6000, hi = 400000;
  const x = (Math.log(Math.max(v, lo)) - Math.log(lo)) / (Math.log(hi) - Math.log(lo));
  return Math.max(0, Math.min(5, Math.round(x*5)));
}
function buildZones(){
  zoneLayers.forEach(l => map.removeLayer(l));
  zoneLayers.length = 0;
  if (!showPrices) return;
  ZONES.zones.forEach(z => {
    const c = R_RAMP[zTier(z)];
    const lbl = z.ha ? fmtK(z.ha[0]) + "–" + fmtK(z.ha[1]) + " /ha"
              : z.apt ? fmtK(z.apt[0]) + "–" + fmtK(z.apt[1]) + " /m²"
              : z.lot ? z.lot[0] + "–" + z.lot[1] + " /m²" : null;
    if (!lbl) return;
    const cm = L.circleMarker([z.lat, z.lon], {
      radius: 7, color: "rgba(9,20,15,.8)", weight: 1.4, fillColor: c, fillOpacity: .9, pane: "shadowPane"
    }).addTo(map);
    cm.bindTooltip(`<b>${z.n}</b><br>${lbl}`, {
      permanent: true, direction: "right", offset: [8, 0], className: "ztip", opacity: 1
    });
    cm.on("click", () => openZone(z));
    cm._zone = z;
    zoneLayers.push(cm);
  });
  requestAnimationFrame(refreshZoneTips);
}

/* ============ popups ============ */
function priceCells(z){
  if (!z) return "";
  const cells = [];
  if (z.ha)  cells.push(`<div class="pcell"><div class="pk">${t("p.ha")}</div><div class="pv">${fmtK(z.ha[0])}–${fmtK(z.ha[1])}</div><div class="pu">${t("p.perha")}</div></div>`);
  if (z.apt) cells.push(`<div class="pcell"><div class="pk">${t("p.apt")}</div><div class="pv">${fmtK(z.apt[0])}–${fmtK(z.apt[1])}</div><div class="pu">${t("p.perm2")}</div></div>`);
  if (z.lot) cells.push(`<div class="pcell"><div class="pk">${t("p.lot")}</div><div class="pv">${z.lot[0].toLocaleString("es-UY")}–${z.lot[1].toLocaleString("es-UY")}</div><div class="pu">${t("p.perm2")}</div></div>`);
  return cells.length ? `<div class="pricegrid">${cells.join("")}</div>` : "";
}
function nearBlocks(p){
  const P = pos(p);
  const anch = POIS.anchors.filter(a => a !== p.id).map(id => {
    const o = ALL.find(x => x.id === id);
    return o ? { n: o.n, d: dist(P, pos(o)) } : null;
  }).filter(Boolean).sort((a,b) => a.d - b.d);
  const close = ALL.filter(o => o.id !== p.id && o.c !== "town" && !POIS.anchors.includes(o.id))
    .map(o => ({ n: o.n, d: dist(P, pos(o)) })).sort((a,b) => a.d - b.d).slice(0, 3);
  const li = a => a.map(x => `<li><span>${x.n}</span><b>${fmtKm(x.d)}</b></li>`).join("");
  return `<div class="near"><div class="nt">${t("p.near")}</div><ul>${li(anch.slice(0,5))}</ul></div>` +
         (close.length ? `<div class="near"><div class="nt">${t("p.closest")}</div><ul>${li(close)}</ul></div>` : "");
}
function popupHTML(p){
  if (p._sale) return salePopup(p);
  if (p._mine) return minePopup(p);
  const cat = POIS.cats[p.c], z = zoneById[p.z], P = pos(p);
  const moved = !!overrides[p.id];
  return `<div class="pop">
    <div class="pop-h">
      <div class="pop-k" style="color:${cat.c}">${nm(cat)}${z ? " · " + z.n : ""}</div>
      <h3>${p.n}</h3>
      ${p.addr ? `<div class="pop-addr">${p.addr}</div>` : ""}
    </div>
    <div class="pop-b">
      <p>${nm(p)}</p>
      ${priceCells(z)}
      ${nearBlocks(p)}
      <div class="pop-act">
        <button onclick="routeFrom('${p.id}')">${t("p.routefrom")}</button>
        <a href="https://www.google.com/maps/search/?api=1&query=${P[0]},${P[1]}" target="_blank" rel="noopener">Google Maps</a>
      </div>
      <div class="prec">${["A","B","E","V"].includes(p.p) || moved ? "✓ " + t("p.exact") : "○ " + t("p.approx")}</div>
    </div>
  </div>`;
}
function openZone(z){
  L.popup({ maxWidth: 340 })
    .setLatLng([z.lat, z.lon])
    .setContent(`<div class="pop"><div class="pop-h"><div class="pop-k" style="color:var(--gold)">${t("p.zone")}</div><h3>${z.n}</h3></div>
      <div class="pop-b"><p>${L10N === "es" ? z.sub_es : z.sub_en}</p>${priceCells(z)}
      <p style="font-size:.8rem">${L10N === "es" ? z.d_es : z.d_en}</p>
      ${typeof zoneComps === "function" ? zoneComps(z.id) : ""}</div></div>`)
    .openOn(map);
}

/* ============ markers ============ */
function labelVisible(p){
  if (!showLabels) return false;
  const z = map.getZoom(), big = p.c === "town" || POIS.anchors.includes(p.id);
  if (showPrices && p.c === "town" && zoneById[p.z] && z < 13) return false;
  if (z >= 13) return true;
  if (p.c === "mine") return z >= 9;
  if (z >= 11) return big || p.c === "dev" || p.c === "edu" || p.c === "wine" || p.c === "sold";
  if (z >= 9)  return big;
  return false;
}
/* priority: higher wins a collision */
function labelPrio(p){
  if (sel === p.id) return 100;
  if (p.c === "mine") return 90;
  if (p.c === "sold") return 70;
  if (POIS.anchors.includes(p.id)) return 60;
  if (p.c === "town") return 50;
  if (p.c === "dev" || p.c === "edu") return 40;
  if (p.c === "wine" || p.c === "art") return 30;
  return 20;
}
function iconFor(p, isSel){
  const cat = POIS.cats[p.c];
  const big = p.c === "town" || p.c === "mine" || POIS.anchors.includes(p.id);
  const s = p.c === "mine" ? 22 : (big ? 20 : 15);
  return L.divIcon({
    className: "", iconSize: [s, s], iconAnchor: [s/2, s/2],
    html: `<div style="position:relative"><div class="mk${isSel ? " sel" : ""}${p.c === "mine" ? " mine" : ""}${p.c === "sold" ? " sold" : ""}${editMode && !["A","B","E","V"].includes(p.p) && !overrides[p.id] ? " approx" : ""}" style="width:${s}px;height:${s}px;background:${cat.c}">${big ? cat.i : ""}</div>${labelVisible(p) || isSel ? `<div class="mklbl">${p.n}</div>` : ""}</div>`
  });
}
let _zt = null, _lastZoom = null;
function scheduleRefresh(){
  clearTimeout(_zt);
  _zt = setTimeout(() => {
    if (map.getZoom() !== _lastZoom) { _lastZoom = map.getZoom(); refreshIcons(); }
    refreshZoneTips();
  }, 60);
}
map.on("zoomend", scheduleRefresh);
map.on("moveend", scheduleRefresh);
function refreshIcons(){
  Object.entries(markers).forEach(([k, m]) => {
    const q = ALL.find(x => x.id === k);
    if (q) m.setIcon(iconFor(q, sel === k));
  });
  styleLabels();
  requestAnimationFrame(refreshZoneTips);
}
function overlaps(a, b){
  return !(a.x2 < b.x1 - 3 || a.x1 > b.x2 + 3 || a.y2 < b.y1 - 2 || a.y1 > b.y2 + 2);
}
function refreshZoneTips(){
  const z = map.getZoom();
  const sz = map.getSize();
  const placed = [];
  const items = [];

  // zone price tooltips
  const zoneOn = z >= 8 && z <= 14;
  zoneLayers.forEach(l => {
    const el = l.getTooltip()?.getElement();
    if (!el) return;
    if (!zoneOn) { el.style.display = "none"; return; }
    const p = map.latLngToContainerPoint(l.getLatLng());
    // zoomed in, project names matter more than zone averages
    items.push({ el, p, w: el.offsetWidth || 118, h: el.offsetHeight || 30, ox: 10, oy: 0,
                 prio: (z >= 13 ? 12 : 45) + (l._zone?.mom || 0) });
  });

  // marker name labels
  Object.entries(markers).forEach(([k, m]) => {
    const el = m.getElement?.()?.querySelector(".mklbl");
    if (!el) return;
    const q = ALL.find(x => x.id === k);
    const p = map.latLngToContainerPoint(m.getLatLng());
    items.push({ el, p, w: el.offsetWidth || 80, h: el.offsetHeight || 13, ox: 0, oy: 12,
                 prio: labelPrio(q), center: true });
  });

  items.sort((a, b) => b.prio - a.prio);
  items.forEach(it => {
    const x1 = it.p.x + it.ox - (it.center ? it.w / 2 : 0);
    const box = { x1, x2: x1 + it.w, y1: it.p.y + it.oy - it.h / 2, y2: it.p.y + it.oy + it.h / 2 };
    const off = box.x2 < -40 || box.x1 > sz.x + 40 || box.y2 < -40 || box.y1 > sz.y + 40;
    if (off || placed.some(b => overlaps(box, b))) { it.el.style.display = "none"; return; }
    it.el.style.display = "";
    placed.push(box);
  });
}
function buildMarkers(){
  Object.values(markers).forEach(m => map.removeLayer(m));
  ALL.forEach(p => {
    if (!active.has(p.c)) return;
    const m = L.marker(pos(p), { icon: iconFor(p, sel === p.id), draggable: editMode, riseOnHover: true, zIndexOffset: p.c === "town" ? 500 : 0 });
    if (editMode) m.getElement && m.on("add", () => m.getElement()?.classList.add("dragme"));
    m.on("click", ev => {
      if (tool === "route") { L.DomEvent.stop(ev); map.fire("click", { latlng: L.latLng(pos(p)) }); return; }
      selectPoi(p.id);
    });
    m.on("dragend", e => {
      const ll = e.target.getLatLng();
      overrides[p.id] = [+ll.lat.toFixed(6), +ll.lng.toFixed(6)];
      localStorage.setItem(OVR_KEY, JSON.stringify(overrides));
      { const x = document.getElementById("tExport"); if (x) x.hidden = false; }
      toast(p.n + " → " + ll.lat.toFixed(4) + ", " + ll.lng.toFixed(4));
    });
    m.addTo(map);
    markers[p.id] = m;
  });
  styleLabels();
  requestAnimationFrame(refreshZoneTips);
}
function selectPoi(id, fly){
  sel = id;
  const p = ALL.find(x => x.id === id);
  if (!p) return;
  Object.entries(markers).forEach(([k, m]) => {
    const q = ALL.find(x => x.id === k);
    if (q) m.setIcon(iconFor(q, k === id));
  });
  requestAnimationFrame(refreshZoneTips);
  if (fly) map.flyTo(pos(p), Math.max(map.getZoom(), 13), { duration: .7 });
  markers[id]?.bindPopup(popupHTML(p), { maxWidth: 340, autoPanPadding: [30, 60] }).openPopup();
  drawList();
  document.querySelector(`.poi[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" });
}

/* ============ sidebar ============ */
let filter = "";
function visiblePois(){
  const f = filter.trim().toLowerCase();
  return ALL.filter(p => active.has(p.c) &&
    (!f || p.n.toLowerCase().includes(f) || nm(POIS.cats[p.c]).toLowerCase().includes(f) || nm(p).toLowerCase().includes(f)));
}
function drawCats(){
  const counts = {};
  ALL.forEach(p => counts[p.c] = (counts[p.c] || 0) + 1);
  setHTML("cats", Object.entries(POIS.cats).map(([k, c]) =>
    `<div class="catrow${active.has(k) ? "" : " off"}" data-cat="${k}" role="checkbox" tabindex="0" aria-checked="${active.has(k)}">
      <span class="swatch" style="background:${c.c}"></span><span class="cl">${nm(c)}</span><span class="cn">${counts[k] || 0}</span></div>`).join(""));
  setTxt("allToggle", active.size ? t("ui.none") : t("ui.all"));
}
function drawList(){
  const v = visiblePois();
  setTxt("poiCount", v.length);
  setHTML("poilist", v.length
    ? v.map(p => `<button class="poi${sel === p.id ? " on" : ""}" data-id="${p.id}">
        <span class="pdot" style="background:${POIS.cats[p.c].c}"></span>
        <span><span class="pn">${p.n}</span><span class="pc">${nm(POIS.cats[p.c])}${zoneById[p.z] ? " · " + zoneById[p.z].n : ""}</span></span></button>`).join("")
    : `<div class="empty">${t("t.nores")}</div>`);
}

/* ============ tools ============ */
let mPts = [], mLayer = L.layerGroup().addTo(map), rLayer = L.layerGroup().addTo(map);
let rtPts = [], rtLayer = L.layerGroup().addTo(map);

async function drawRoute(a, b){
  rtLayer.clearLayers();
  L.circleMarker(a, { radius:6, color:"#c5a572", fillColor:"#0d1a14", fillOpacity:1, weight:3 }).addTo(rtLayer);
  L.circleMarker(b, { radius:6, color:"#c5a572", fillColor:"#c5a572", fillOpacity:1, weight:3 }).addTo(rtLayer);
  const loading = L.marker([(a[0]+b[0])/2, (a[1]+b[1])/2],
    { icon: L.divIcon({ className:"", html:`<div class="mlabel">${t("r.calc")}</div>`, iconSize:[0,0] }) }).addTo(rtLayer);
  try {
    const u = `https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`;
    const j = await (await fetch(u)).json();
    if (!j.routes || !j.routes.length) throw new Error("no route");
    const r = j.routes[0];
    const line = r.geometry.coordinates.map(c => [c[1], c[0]]);
    rtLayer.removeLayer(loading);
    L.polyline(line, { className:"route-halo" }).addTo(rtLayer);
    L.polyline(line, { className:"route-line" }).addTo(rtLayer);
    const mid = line[Math.floor(line.length/2)];
    const km = (r.distance/1000), min = Math.round(r.duration/60);
    L.marker(mid, { icon: L.divIcon({ className:"",
      html:`<div class="mlabel">${km < 10 ? km.toFixed(1).replace(".", ",") : Math.round(km)} km · ${min} ${t("r.min")}</div>`,
      iconSize:[0,0] }) }).addTo(rtLayer);
    map.fitBounds(L.latLngBounds(line).pad(0.15));
  } catch (e) {
    rtLayer.removeLayer(loading);
    L.polyline([a, b], { className:"measure-line" }).addTo(rtLayer);
    L.marker([(a[0]+b[0])/2, (a[1]+b[1])/2], { icon: L.divIcon({ className:"",
      html:`<div class="mlabel">${fmtKm(dist(a, b))}</div>`, iconSize:[0,0] }) }).addTo(rtLayer);
    toast(t("r.fail"));
  }
}
function routeFrom(id){
  const p = ALL.find(x => x.id === id);
  if (!p) return;
  rtPts = [pos(p)];
  if (tool !== "route") setTool("route");
  toast(p.n + " → " + t("h.route").split(".")[0].toLowerCase());
}
function setTool(k){
  tool = tool === k ? null : k;
  ["tMeasure","tRoute","tRings","tEdit"].forEach(id => document.getElementById(id).setAttribute("aria-pressed", tool === { tMeasure:"measure", tRoute:"route", tRings:"rings", tEdit:"edit" }[id]));
  setTxt("toolHint", t(tool ? "h." + tool : "h.idle"));
  map.getContainer().style.cursor = (tool === "measure" || tool === "rings" || tool === "route") ? "crosshair" : "";
  if (tool !== "measure") { mPts = []; mLayer.clearLayers(); }
  if (tool !== "route") { rtPts = []; rtLayer.clearLayers(); }
  if (tool !== "rings") rLayer.clearLayers();
  const wasEdit = editMode;
  editMode = tool === "edit";
  if (wasEdit !== editMode) { buildMarkers(); toast(t(editMode ? "t.editon" : "t.editoff")); }
}
map.on("click", e => {
  if (tool === "measure") {
    mPts.push([e.latlng.lat, e.latlng.lng]);
    if (mPts.length > 2) { mPts = [mPts[mPts.length-1]]; mLayer.clearLayers(); }
    L.circleMarker(mPts[mPts.length-1], { radius:5, color:"#c5a572", fillColor:"#c5a572", fillOpacity:1, weight:2 }).addTo(mLayer);
    if (mPts.length === 2) {
      L.polyline(mPts, { className:"measure-line" }).addTo(mLayer);
      const mid = [(mPts[0][0]+mPts[1][0])/2, (mPts[0][1]+mPts[1][1])/2];
      L.marker(mid, { icon: L.divIcon({ className:"", html:`<div class="mlabel">${fmtKm(dist(mPts[0], mPts[1]))}</div>`, iconSize:[0,0] }) }).addTo(mLayer);
    }
  } else if (tool === "route") {
    rtPts.push([e.latlng.lat, e.latlng.lng]);
    if (rtPts.length === 1) {
      rtLayer.clearLayers();
      L.circleMarker(rtPts[0], { radius:6, color:"#c5a572", fillColor:"#0d1a14", fillOpacity:1, weight:3 }).addTo(rtLayer);
    } else {
      drawRoute(rtPts[0], rtPts[1]);
      rtPts = [];
    }
  } else if (tool === "rings") {
    rLayer.clearLayers();
    [5,10,20].forEach((km, i) => {
      L.circle([e.latlng.lat, e.latlng.lng], { radius: km*1000, color:"#c5a572", weight:1.4, opacity:.55 - i*.1, fill:true, fillOpacity:.04, dashArray:"6 6" }).addTo(rLayer);
      L.marker([e.latlng.lat + km/111, e.latlng.lng], { icon: L.divIcon({ className:"", html:`<div class="ringlabel">${km} km</div>`, iconSize:[0,0] }) }).addTo(rLayer);
    });
    L.circleMarker([e.latlng.lat, e.latlng.lng], { radius:4, color:"#c5a572", fillOpacity:1, weight:2 }).addTo(rLayer);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && tool) setTool(tool); });
map.on("contextmenu", () => { if (tool) setTool(tool); });

/* ============ search ============ */
let searchTimer = null, searchMarker = null;
function runSearch(){
  const q = document.getElementById("q").value;
  filter = q; drawList();
  const box = document.getElementById("sugg");
  if (q.trim().length < 2) { box.innerHTML = ""; return; }
  const local = visiblePois().slice(0, 6).map(p =>
    `<button data-poi="${p.id}"><div class="sn">${p.n}</div><div class="sm">${nm(POIS.cats[p.c])}${zoneById[p.z] ? " · " + zoneById[p.z].n : ""}</div></button>`).join("");
  box.innerHTML = local + `<button disabled style="cursor:default"><div class="sm">${t("s.searching")}</div></button>`;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    try {
      const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=5&viewbox=-55.6,-33.5,-53.2,-35.1&bounded=1&q=" + encodeURIComponent(q),
        { headers: { "Accept-Language": L10N } });
      const j = await r.json();
      box.innerHTML = local + j.map(x =>
        `<button data-lat="${x.lat}" data-lon="${x.lon}"><div class="sn">${x.display_name.split(",")[0]}</div><div class="sm">${t("s.addr")} · ${x.display_name.split(",").slice(1,4).join(",").trim()}</div></button>`).join("");
    } catch (err) { box.innerHTML = local; }
  }, 550);
}
document.getElementById("q").addEventListener("input", runSearch);
document.getElementById("sugg").addEventListener("click", e => {
  const b = e.target.closest("button[data-poi],button[data-lat]");
  if (!b) return;
  setHTML("sugg", "");
  if (b.dataset.poi) selectPoi(b.dataset.poi, true);
  else {
    const ll = [+b.dataset.lat, +b.dataset.lon];
    if (searchMarker) map.removeLayer(searchMarker);
    searchMarker = L.marker(ll, { icon: L.divIcon({ className:"", iconSize:[18,18], iconAnchor:[9,9],
      html:`<div class="mk" style="width:18px;height:18px;background:#fff;border-color:#c5a572">✚</div>` }) }).addTo(map);
    map.flyTo(ll, 15, { duration: .8 });
  }
});
document.addEventListener("click", e => { if (!e.target.closest(".searchwrap")) setHTML("sugg", ""); });

/* ============ chrome ============ */
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2400);
}
function drawChrome(){
  document.querySelectorAll("[data-i]").forEach(e => {
   if (e.tagName === "OPTION") { const s = e.parentElement, v = s.value; e.textContent = t(e.dataset.i); s.value = v; }
   else if (e.dataset.i === "t.title" || e.dataset.i === "t.taxDisc") e.innerHTML = t(e.dataset.i);
   else e.textContent = t(e.dataset.i);
 });
  document.getElementById("q").placeholder = t("ui.search");
  setTxt("scalenote", t("sc.straight").replace("{n}", ALL.length));
  setHTML("basebar", [["streets","b.streets"],["sat","b.sat"]]
    .map(([k, l]) => `<button class="basebtn" data-base="${k}" aria-pressed="${base === k}">${t(l)}</button>`).join(""));
  setTxt("toolHint", t(tool ? "h." + tool : "h.idle"));
  drawCats(); drawList(); buildZones();
  if (typeof drawSections === "function") drawSections();
  const _mc = document.getElementById("mineCount"); if (_mc) _mc.textContent = MINE.length;
  if (typeof drawReview === "function") drawReview();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  const row = e.target.closest(".catrow");
  if (row) {
    const k = row.dataset.cat;
    active.has(k) ? active.delete(k) : active.add(k);
    drawCats(); drawList(); buildMarkers(); return;
  }
  if (!b) return;
  if (b.dataset.lang) {
    L10N = b.dataset.lang;
    document.querySelectorAll("[data-lang]").forEach(x => x.setAttribute("aria-pressed", x.dataset.lang === L10N));
    drawChrome(); buildMarkers();
    if (sel) markers[sel]?.setPopupContent(popupHTML(ALL.find(p => p.id === sel)));
    return;
  }
  if (b.dataset.base) { setBase(b.dataset.base); return; }
  if (b.id === "allToggle") {
    if (active.size) active.clear(); else Object.keys(POIS.cats).forEach(k => active.add(k));
    drawCats(); drawList(); buildMarkers(); return;
  }
  if (b.id === "btnPrices") { showPrices = !showPrices; b.setAttribute("aria-pressed", showPrices); buildZones(); buildMarkers(); return; }
  if (b.id === "btnLabels") {
    showLabels = !showLabels; b.setAttribute("aria-pressed", showLabels);
    buildMarkers(); if (base === "sat") setBase("sat"); return;
  }
  if (b.id === "tMeasure") return setTool("measure");
  if (b.id === "tRoute") return setTool("route");
  if (b.id === "tRings") return setTool("rings");
  if (b.id === "tEdit") return setTool("edit");
  if (b.id === "tExport") {
    const out = JSON.stringify(overrides, null, 1);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "application/json" }));
    a.download = "tango-ubicaciones-corregidas.json"; a.click();
    toast(t("t.saved")); return;
  }
  const p = e.target.closest(".poi");
  if (p) selectPoi(p.dataset.id, true);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("catrow")) { e.preventDefault(); e.target.click(); }
});

/* ============ boot (called at the end of extras.js) ============ */
function boot(){
  const _te = document.getElementById("tExport"); if (_te && Object.keys(overrides).length) _te.hidden = false;
  drawChrome();
  buildMarkers();
  map.fitBounds([[-34.99, -55.30], [-34.52, -54.50]], { padding: [24, 24] });
  setTimeout(() => { _lastZoom = map.getZoom(); refreshIcons(); refreshZoneTips(); }, 150);
  /* deep link desde la pagina de propiedades: /mapa/?p=<id> */
  try {
    const want = new URLSearchParams(location.search).get("p");
    if (want && markers[want]) setTimeout(() => selectPoi(want, true), 420);
  } catch (e) {}
}

</script>

 {v:"4.178",u:"USD/ha",es:"Precio promedio de la tierra en Uruguay, récord 2025",en:"Uruguay average land price, 2025 record",d:"+5,0% a/a",de:"+5.0% YoY"},

 {v:"76",u:"",es:"Complejos activos en Punta del Este y balnearios vecinos",en:"Active complexes in Punta del Este and nearby resorts",d:"80% lanzados en 5 años",de:"80% launched within 5 years"},
 {v:"4.100",u:"USD/m²",es:"Precio promedio de apartamento en Punta del Este",en:"Average apartment price in Punta del Este",d:"+6% a/a en dólares",de:"+6% YoY in dollars"},
 {v:"12.000",u:"M USD",es:"Inversión directa en construcción en Maldonado, últimos 7 años",en:"Direct construction investment in Maldonado, last 7 years",d:"5,5 M de m² construidos",de:"5.5 M m² built"},

];
const THESIS = [
 {k_es:"Demanda",k_en:"Demand",h_es:"El mercado dejó de ser de verano",h_en:"The market stopped being seasonal",

  p_en:"Maldonado is projected to grow from 216,808 residents in 2025 to 245,454 by 2045. That demographic growth — not tourism — is what underpins year-round rental income and explains why 80% of active projects launched in the last five years."},
 {k_es:"Oferta",k_en:"Supply",h_es:"La tierra costera no se repone",h_en:"Coastal land does not replenish",
  p_es:"José Ignacio no permite altura y no tiene tierra costera libre. Garzón tiene un mínimo legal de subdivisión rural de 5 hectáreas. La Laguna de Rocha está dentro del sistema de áreas protegidas. La restricción normativa es, en este mercado, el principal protector del valor.",
  p_en:"José Ignacio allows no height and has no vacant coastal land. Garzón carries a 5-hectare legal minimum for rural subdivision. Laguna de Rocha sits inside the protected-areas system. In this market, regulatory restriction is the main protector of value."},
 {k_es:"Arbitraje",k_en:"Arbitrage",h_es:"La brecha entre corredores es enorme",h_en:"The spread between corridors is wide",
  p_es:"Un lote en Santa Mónica se pide a USD 250–550/m². El mismo frente de mar en La Pedrera, a una hora, cotiza entre 10 y 110. Una chacra sobre la Laguna José Ignacio pide 360.000/ha; a veinte minutos, sobre Ruta 104, se consiguen a 26.000. El mapa está hecho para leer esas brechas.",
  p_en:"A lot in Santa Mónica asks USD 250–550/m². The same ocean frontage in La Pedrera, an hour away, trades between 10 and 110. A chacra on Laguna José Ignacio asks 360,000/ha; twenty minutes inland on Route 104, comparable land goes for 26,000. This map exists to read those gaps."},
 {k_es:"Marco",k_en:"Framework",h_es:"Moneda, título y régimen fiscal",h_en:"Currency, title and tax",
  p_es:"El mercado opera en dólares, sin restricción a la propiedad extranjera y con registro de propiedad confiable. Para el inversor estadounidense o europeo, esa combinación —rara en la región— suele pesar más en la decisión que el rendimiento marginal.",
  p_en:"The market runs in dollars, with no restriction on foreign ownership and a reliable property registry. For a US or European investor that combination — rare in the region — usually weighs more in the decision than marginal yield."}
];

const compUnit = c => c.cls === "ha" ? c.usd / c.ha : c.usd / c.m2;
const fmtUSD = v => "USD " + Math.round(v).toLocaleString("es-UY");
let compFilter = "all", compSort = { k: "unit", dir: -1 };

function drawKpis(){
  document.getElementById("kpis").innerHTML = KPI.map(k =>
    `<div class="kpi"><div class="v">${k.v}${k.u ? `<small>${k.u}</small>` : ""}</div>
     <div class="l">${L10N === "es" ? k.es : k.en}</div>
     <div class="d">${L10N === "es" ? k.d : k.de}</div></div>`).join("");
}
function drawThesis(){
  document.getElementById("thesis").innerHTML = THESIS.map(x =>
    `<div class="card"><div class="ck">${L10N === "es" ? x.k_es : x.k_en}</div>
     <h3>${L10N === "es" ? x.h_es : x.h_en}</h3>
     <p>${L10N === "es" ? x.p_es : x.p_en}</p></div>`).join("");
}
function drawSrcs(){
  document.getElementById("srcs").innerHTML =
    ATLAS.srcs.map(s => `<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join("");
}
function drawComps(){
  const rows = ATLAS.comps.filter(c => compFilter === "all" || c.cls === compFilter).slice().sort((a, b) => {
    const f = compSort.k;
    if (f === "z") return compSort.dir * a.z.localeCompare(b.z);
    const va = f === "unit" ? compUnit(a) : f === "price" ? a.usd : (a.cls === "ha" ? a.ha * 10000 : a.m2);
    const vb = f === "unit" ? compUnit(b) : f === "price" ? b.usd : (b.cls === "ha" ? b.ha * 10000 : b.m2);
    return compSort.dir * (va - vb);
  });
  const th = (k, lab, n) => `<th data-sc="${k}" style="cursor:pointer${n ? ";text-align:right" : ""}">${lab}${compSort.k === k ? (compSort.dir > 0 ? " ↑" : " ↓") : ""}</th>`;
  document.getElementById("compTable").innerHTML =
   `<thead><tr>${th("z", t("c.zone"))}<th>${t("c.desc")}</th>${th("size", t("c.size"), 1)}${th("price", t("c.price"), 1)}${th("unit", t("c.unit"), 1)}</tr></thead>
    <tbody>${rows.map(c => `<tr data-czone="${c.zone}">
      <td class="strong">${c.z}</td><td>${L10N === "es" ? c.n_es : c.n_en}</td>
      <td class="n">${c.cls === "ha" ? c.ha.toLocaleString("es-UY") + " ha" : c.m2.toLocaleString("es-UY") + " m²"}</td>
      <td class="n">${fmtUSD(c.usd)}</td>
      <td class="n strong">${Math.round(compUnit(c)).toLocaleString("es-UY")}${c.cls === "ha" ? " /ha" : " /m²"}</td>
    </tr>`).join("")}</tbody>`;
}
function drawDevsTable(){
  document.getElementById("devTable").innerHTML =
   `<thead><tr><th>${t("d.name")}</th><th>${t("d.zone")}</th><th>${t("d.dev")}</th><th>${t("d.inv")}</th><th>${t("d.tk")}</th><th>${t("d.eta")}</th><th style="min-width:260px">${t("d.note")}</th></tr></thead>
    <tbody>${ATLAS.devs.map(d => {
      const z = zoneById[d.z];
      return `<tr><td class="strong">${d.n}</td><td>${z ? z.n : d.z}</td><td>${d.dev}</td>
        <td class="n">${d.inv}</td><td class="n">${d.tk}</td><td>${d.eta}</td>
        <td>${L10N === "es" ? d.d_es : d.d_en}</td></tr>`;
    }).join("")}</tbody>`;
}
function drawSalesTable(){
  const MES = ["","enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
  const MEN = ["","January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("salesTable").innerHTML =
   `<thead><tr><th>${t("c.desc")}</th><th>${t("s.when")}</th><th style="text-align:right">${t("c.size")}</th>
     <th style="text-align:right">${t("s.base")}</th><th style="text-align:right">${t("s.final")}</th>
     <th style="text-align:right">${t("c.unit")}</th><th>${t("s.src")}</th></tr></thead>
    <tbody>${SALES.sales.map(s => {
      const up = s.usd / s.size;
      return `<tr><td class="strong">${s.n}</td>
       <td>${(L10N === "es" ? MES : MEN)[s.month || 0]} ${s.year}</td>
       <td class="n">${s.size.toLocaleString("es-UY")} ${s.unit === "ha" ? "ha" : "m²"}</td>
       <td class="n">${s.base ? fmtUSD(s.base) : "—"}</td>
       <td class="n strong">${fmtUSD(s.usd)}</td>
       <td class="n strong">${Math.round(up).toLocaleString("es-UY")}${s.unit === "ha" ? " /ha" : " /m²"}</td>
       <td><a href="${s.src}" target="_blank" rel="noopener" style="color:#8a6d2f">${t("s.see")}</a></td></tr>`;
    }).join("")}</tbody>`;
}
/* comparables belong to a zone, so they show up in the zone panel too */
function zoneComps(zid){
  const cs = ATLAS.comps.filter(c => c.zone === zid);
  if (!cs.length) return "";
  cs.sort((a, b) => compUnit(b) - compUnit(a));
  return `<div class="zcomps"><div class="zt">${t("s.comps")} · ${cs.length}</div>
    ${cs.slice(0, 8).map(c => `<div class="zc">
      <span class="zcn">${c.cls === "ha" ? c.ha.toLocaleString("es-UY") + " ha" : c.m2.toLocaleString("es-UY") + " m²"} · ${fmtUSD(c.usd)}</span>
      <span class="zcv">${Math.round(compUnit(c)).toLocaleString("es-UY")}${c.cls === "ha" ? " /ha" : " /m²"}</span>
    </div>`).join("")}
    ${cs.length > 8 ? `<div class="zc"><span class="zcn" style="font-style:italic">+ ${cs.length - 8} ${t("s.more")}</span></div>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const th = e.target.closest("th[data-sc]");
  if (th) { const k = th.dataset.sc;
    if (compSort.k === k) compSort.dir *= -1; else compSort = { k, dir: k === "z" ? 1 : -1 };
    drawComps(); return; }
  const cf = e.target.closest("[data-cf]");
  if (cf) { compFilter = cf.dataset.cf;
    document.querySelectorAll("[data-cf]").forEach(x => x.setAttribute("aria-pressed", x.dataset.cf === compFilter));
    drawComps(); return; }
  const row = e.target.closest("tr[data-czone]");
  if (row && row.dataset.czone && zoneById[row.dataset.czone]) {
    document.getElementById("mapa").scrollIntoView({ behavior: "smooth", block: "start" });
    setTimeout(() => openZone(zoneById[row.dataset.czone]), 420);
  }
});
function drawSections(){
  document.getElementById("compfilter").innerHTML = [["all","c.all"],["ha","c.ha"],["lot","c.lot"]]
    .map(([k, lab]) => `<button class="chip" data-cf="${k}" aria-pressed="${compFilter === k}">${t(lab)}</button>`).join("");
  drawKpis(); drawThesis(); drawSrcs(); drawComps(); drawDevsTable(); drawSalesTable();
}

</script>
<script>
/* ============ extra layers: closed sales + own listings ============ */
POIS.cats.sold = { c:"#b8607a", es:"Ventas cerradas", en:"Closed sales", i:"✓" };
POIS.cats.mine = { c:"#e8b563", es:"Propiedades Tango", en:"Tango listings", i:"★" };

const MINE_KEY = "tango_listings_v1";
const INTERNAL = AUDIENCE === "interno";
let MINE = LISTINGS.slice();
if (INTERNAL) {
  try {
    const saved = JSON.parse(localStorage.getItem(MINE_KEY) || "null");
    if (Array.isArray(saved) && saved.length) MINE = saved;
  } catch (e) {}
}
const saveMine = () => { if (INTERNAL) { try { localStorage.setItem(MINE_KEY, JSON.stringify(MINE)); } catch (e) {} } };

const KIND_ES = { casa:"Casa", depto:"Departamento", chacra:"Chacra", campo:"Campo / estancia", terreno:"Terreno / lote", lote:"Terreno / lote", comercial:"Comercial", edificio:"Edificio", otro:"Propiedad" };
const KIND_EN = { casa:"House", depto:"Apartment", chacra:"Chacra", campo:"Farmland / estancia", terreno:"Land / lot", lote:"Land / lot", comercial:"Commercial", edificio:"Building", otro:"Property" };
const ST_ES = { venta:"En venta", reservada:"Reservada", vendida:"Vendida" };
const ST_EN = { venta:"For sale", reservada:"Reserved", vendida:"Sold" };

function saleToPoi(s){
  return { id:s.id, c:"sold", p:s.p, lat:s.lat, lon:s.lon, n:s.n, z:s.zone, es:s.es, en:s.en, _sale:s };
}
function mineToPoi(m){
  return { id:m.id, c:"mine", p:m.prec || "E", lat:+m.lat, lon:+m.lon, n:m.n, z:m.zone || null,
           addr:m.addr || "", es:m.desc_es || "", en:m.desc_en || m.desc_es || "", _mine:m };
}
/* ALL is declared in mapapp.js; we only widen it here */
function rebuildAll(){
  ALL = POIS.pois.concat(SALES.sales.map(saleToPoi), MINE.map(mineToPoi));
}
rebuildAll();

/* ---- unit price helpers ---- */
function unitPrice(usd, size, unit){
  if (!usd || !size) return null;
  return { v: usd / size, u: unit === "ha" ? "USD/ha" : "USD/m²" };
}
function fmtMoney(v){ return "USD " + Math.round(v).toLocaleString("es-UY"); }

/* ---- popup: closed sale ---- */
function salePopup(p){
  const s = p._sale, z = zoneById[p.z];
  const up = unitPrice(s.usd, s.size, s.unit);
  const mult = s.base ? (s.usd / s.base) : null;
  const MES = ["","enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
  const MEN = ["","January","February","March","April","May","June","July","August","September","October","November","December"];
  const when = (L10N === "es" ? MES : MEN)[s.month || 0];
  return `<div class="pop">
    <div class="pop-h">
      <div class="pop-k" style="color:${POIS.cats.sold.c}">${nm(POIS.cats.sold)}${when ? " · " + when + " " + s.year : " · " + s.year}</div>
      <h3>${p.n}</h3>
    </div>
    <div class="pop-b">
      <div>
        <div class="bigprice">${fmtMoney(s.usd)}</div>
        <div class="bigsub">${s.size.toLocaleString("es-UY")} ${s.unit === "ha" ? "ha" : "m²"}${up ? " · " + Math.round(up.v).toLocaleString("es-UY") + " " + up.u : ""}</div>
      </div>
      ${s.base ? `<div class="pricegrid">
        <div class="pcell"><div class="pk">${L10N==="es"?"Base de remate":"Reserve price"}</div><div class="pv">${fmtK(s.base)}</div><div class="pu">USD</div></div>
        <div class="pcell"><div class="pk">${L10N==="es"?"Sobre la base":"Over reserve"}</div><div class="pv">${mult.toFixed(1).replace(".",",")}×</div><div class="pu">${L10N==="es"?"veces":"times"}</div></div>
      </div>` : ""}
      <p>${nm(p)}</p>
      ${priceCells(z)}
      ${nearBlocks(p)}
      <div class="pop-act">
        <button onclick="routeFrom('${p.id}')">${t("p.routefrom")}</button>
        <a href="${s.src}" target="_blank" rel="noopener">${L10N==="es"?"Fuente":"Source"}</a>
      </div>
      <div class="prec">${p.p === "X" ? "○ " + t("p.approx") : "✓ " + t("p.exact")}</div>
    </div>
  </div>`;
}

/* ---- popup: own listing ---- */
function minePopup(p){
  const m = p._mine, z = zoneById[p.z];
  const up = unitPrice(+m.usd, +m.size, m.unit);
  const KD = (L10N === "es" ? KIND_ES : KIND_EN);
  /* kind puede ser string o lista de tipos */
  const kind = (Array.isArray(m.kind) ? m.kind : [m.kind]).map(k => KD[k] || "").filter(Boolean).join(" · ");
  const st = (L10N === "es" ? ST_ES : ST_EN)[m.status] || "";
  return `<div class="pop">
    ${m.photo ? `<img class="pop-photo" src="${m.photo}" alt="" onerror="this.remove()">` : ""}
    <div class="pop-h">
      <div class="pop-k" style="color:${POIS.cats.mine.c}">${kind}${z ? " · " + z.n : ""}<span class="badge ${m.status}">${st}</span></div>
      <h3>${p.n}</h3>
    </div>
    <div class="pop-b">
      ${m.usd ? `<div>
        <div class="bigprice">${fmtMoney(+m.usd)}</div>
        <div class="bigsub">${m.size ? (+m.size).toLocaleString("es-UY") + " " + (m.unit === "ha" ? "ha" : "m²") : ""}${up ? " · " + Math.round(up.v).toLocaleString("es-UY") + " " + up.u : ""}</div>
      </div>` : ""}
      ${m.addr ? `<div class="pop-addr" style="margin-bottom:2px">${m.addr}</div>` : ""}
      ${m.padron && m.padron !== "—" ? `<div class="padron"><span>${L10N==="es"?"Padrón":"Parcel"}</span><b>${m.padron}</b></div>` : ""}
      ${nm(p) ? `<p>${nm(p)}</p>` : ""}
      ${priceCells(z)}
      ${nearBlocks(p)}
      ${INTERNAL && m.note_int ? `<div class="intnote">${m.note_int}</div>` : ""}
      <div class="prec">${["A","B","E","V"].includes(p.p) ? "✓ " + t("p.exact") : "○ " + t("p.approx")}</div>
      <div class="pop-act">
        <button onclick="routeFrom('${p.id}')">${t("p.routefrom")}</button>
        ${m.link ? `<a href="${m.link}" target="_blank" rel="noopener">${L10N==="es"?"Ficha":"Details"}</a>` : ""}
        ${INTERNAL ? `<button onclick="editListing('${m.id}')">${L10N==="es"?"Editar":"Edit"}</button>` : ""}
      </div>
    </div>
  </div>`;
}

/* ---- zone inference from nearest zone centroid ---- */
function nearestZone(lat, lon){
  let best = null, bd = 1e9;
  ZONES.zones.forEach(z => { const d = dist([lat, lon], [z.lat, z.lon]); if (d < bd) { bd = d; best = z; } });
  return bd < 18 ? best.id : null;
}

/* ---- modal ---- */
const modal = document.getElementById("modal");
const mForm = document.getElementById("mForm");
if (INTERNAL && mForm) {
let editingId = null, picking = false;

function openModal(id){
  editingId = id || null;
  const m = id ? MINE.find(x => x.id === id) : null;
  document.getElementById("modalTitle").textContent = m
    ? (L10N === "es" ? "Editar propiedad" : "Edit listing")
    : (L10N === "es" ? "Nueva propiedad" : "New listing");
  mForm.reset();
  if (m) Object.entries(m).forEach(([k, v]) => { if (mForm.elements[k]) mForm.elements[k].value = v ?? ""; });
  document.getElementById("mDelete").hidden = !m;
  modal.hidden = false;
  setTimeout(() => mForm.elements.n.focus(), 40);
}
function closeModal(){ modal.hidden = true; picking = false; document.getElementById("pickBtn").classList.remove("on"); }
function editListing(id){ openModal(id); }

mForm.addEventListener("submit", e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(mForm).entries());
  f.lat = +f.lat; f.lon = +f.lon;
  if (!isFinite(f.lat) || !isFinite(f.lon)) return;
  f.zone = nearestZone(f.lat, f.lon);
  if (editingId) {
    const i = MINE.findIndex(x => x.id === editingId);
    MINE[i] = { ...MINE[i], ...f };
  } else {
    f.id = "mine-" + Math.abs(((f.n || "") + f.lat + f.lon).split("").reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7)).toString(36) + "-" + MINE.length;
    MINE.push(f);
  }
  saveMine(); rebuildAll(); refreshEverything();
  closeModal();
  toast(L10N === "es" ? "Propiedad guardada" : "Listing saved");
});
document.getElementById("mDelete").addEventListener("click", () => {
  MINE = MINE.filter(x => x.id !== editingId);
  saveMine(); rebuildAll(); refreshEverything(); closeModal();
  toast(L10N === "es" ? "Propiedad eliminada" : "Listing deleted");
});
document.getElementById("mCancel").addEventListener("click", closeModal);
document.getElementById("modalX").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.getElementById("pickBtn").addEventListener("click", e => {
  picking = !picking;
  e.target.classList.toggle("on", picking);
  modal.style.opacity = picking ? "0" : "";
  modal.style.pointerEvents = picking ? "none" : "";
  if (picking) toast(L10N === "es" ? "Hacé clic en el mapa para fijar la ubicación" : "Click the map to set the location");
});
map.on("click", e => {
  if (!picking) return;
  mForm.elements.lat.value = e.latlng.lat.toFixed(6);
  mForm.elements.lon.value = e.latlng.lng.toFixed(6);
  picking = false;
  document.getElementById("pickBtn").classList.remove("on");
  modal.style.opacity = ""; modal.style.pointerEvents = "";
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

/* ---- import / export ---- */
function exportListings(){
  const out = { exported: new Date().toISOString().slice(0, 10), listings: MINE };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
  a.download = "tango-propiedades.json"; a.click();
  toast(L10N === "es" ? "Propiedades descargadas" : "Listings downloaded");
}
function parseCSV(txt){
  const rows = [];
  let cur = [], f = "", q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"' && txt[i+1] === '"') { f += '"'; i++; } else if (c === '"') q = false; else f += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === ";") { cur.push(f); f = ""; }
    else if (c === "\n") { cur.push(f); rows.push(cur); cur = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f || cur.length) { cur.push(f); rows.push(cur); }
  if (rows.length < 2) return [];
  const head = rows[0].map(h => h.trim().toLowerCase());
  return rows.slice(1).filter(r => r.some(c => c.trim())).map(r => {
    const o = {};
    head.forEach((h, i) => o[h] = (r[i] || "").trim());
    return o;
  });
}
function importListings(txt, name){
  let rows;
  try {
    if (/\.csv$/i.test(name)) rows = parseCSV(txt);
    else { const j = JSON.parse(txt); rows = Array.isArray(j) ? j : (j.listings || []); }
  } catch (err) { toast(L10N === "es" ? "No pude leer el archivo" : "Could not read the file"); return; }
  let n = 0;
  rows.forEach((r, i) => {
    const lat = +(r.lat ?? r.latitud ?? r.latitude), lon = +(r.lon ?? r.lng ?? r.longitud ?? r.longitude);
    if (!isFinite(lat) || !isFinite(lon)) return;
    const o = {
      id: r.id || "imp-" + Date.now().toString(36) + "-" + i,
      n: r.n || r.nombre || r.name || ("Propiedad " + (i + 1)),
      kind: r.kind || r.tipo || "otro",
      status: r.status || r.estado || "venta",
      usd: r.usd || r.precio || r.price || "",
      size: r.size || r.superficie || "",
      unit: r.unit || r.unidad || "ha",
      lat, lon,
      desc_es: r.desc_es || r.descripcion || "",
      desc_en: r.desc_en || r.description || "",
      photo: r.photo || r.foto || "",
      link: r.link || r.ficha || ""
    };
    o.zone = nearestZone(lat, lon);
    const j = MINE.findIndex(x => x.id === o.id);
    if (j >= 0) MINE[j] = o; else MINE.push(o);
    n++;
  });
  saveMine(); rebuildAll(); refreshEverything();
  toast((L10N === "es" ? "Importadas " : "Imported ") + n);
}
document.getElementById("mImport").addEventListener("click", () => document.getElementById("mFile").click());
document.getElementById("mExport").addEventListener("click", exportListings);
document.getElementById("mAdd").addEventListener("click", () => openModal(null));
document.getElementById("mFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { importListings(rd.result, f.name); e.target.value = ""; };
  rd.readAsText(f);
});

}   /* end INTERNAL editing block */

/* ---- review panel: pins that still need a human eye ---- */
function drawReview(){
  if (!document.getElementById("revlist")) return;
  const low = ALL.filter(p => !["A","B","E","V"].includes(p.p) && !overrides[p.id]);
  document.getElementById("revCount").textContent = low.length;
  document.getElementById("revlist").innerHTML = low.map(p =>
    `<button class="rev" data-rev="${p.id}"><span class="rq ${p.p}">${p.p === "X" ? "?" : "~"}</span><span class="rn">${p.n}${p.addr ? `<span class="ra">${p.addr}</span>` : ""}</span></button>`).join("")
    || `<div class="empty" style="padding:10px 0">${L10N === "es" ? "Todas revisadas" : "All reviewed"}</div>`;
  document.getElementById("reviewBlock").hidden = low.length === 0;
}
document.addEventListener("click", e => {
  const r = e.target.closest("[data-rev]");
  if (!r) return;
  if (tool !== "edit") setTool("edit");
  selectPoi(r.dataset.rev, true);
});

function refreshEverything(){
  const mc = document.getElementById("mineCount");
  if (mc) mc.textContent = MINE.length;
  drawCats(); drawList(); buildMarkers();
  if (typeof drawReview === "function" && document.getElementById("revlist")) drawReview();
}

/* ---- activate the new layers and start the app ---- */
active.add("sold"); active.add("mine");
rebuildAll();
boot();
refreshEverything();

</script>
